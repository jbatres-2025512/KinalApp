<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Login</title>
    <link rel="icon" href="../static/images/logoKinal.png" th:href="@{/images/logokinal.png}">
    <link rel="stylesheet" th:href="@{/css/login.css}" href="../static/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <form class="login-form" method="post" th:action="@{/login}">
            <div class="login-header">
                <h1 class="login-title">KinalApp | Login</h1>
                <img th:src="@{/images/logokinal.png}" src="../static/images/logoKinal.png" alt="Logo Kinal" class="login-logo">
            </div>
            <div class="form-group">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="Ingrese su usuario" required>
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="userpassword" class="form-input" placeholder="Ingrese su contraseña" required>
            </div>
            <button type="submit" class="btn-login" href="#" th:href="@{/login}">Iniciar Sesión</button>
            <div class="login-footer">
                <p>¿No tiene una cuenta? <a href="#" class="register-link" th:href="@{/register}">Regístrese aquí</a></p>
            </div>
        </form>
    </div>
</body>
</html>
