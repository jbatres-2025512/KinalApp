<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Productos</title>
    <link rel="icon" href="../static/images/logoKinal.png" th:href="@{/images/logokinal.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/product.css}" href="../static/css/product.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

<nav>
    <div class="nav-left">
        <img th:src="@{/images/logokinal.png}" src="../static/images/logoKinal.png" alt="Logo Kinal" class="nav-logo">
        <h1 class="nav-title">KinalApp | <a th:href="@{/}">Home</a></h1>
    </div>
    <div class="nav-center">Gesti&oacute;n de Productos</div>
    <div class="nav-right">
        <a th:href="@{/login}" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesi&oacute;n</a>
    </div>
</nav>

<main>
    <section class="search-section">
        <h2 class="section-title"><i class="fas fa-search"></i> Buscar Producto</h2>
        <form th:action="@{/product/search}" method="get" class="search-form">
            <div class="search-container">
                <input type="text" name="code" placeholder="Ingrese c&oacute;digo del producto" class="search-input">
                <button type="submit" class="btn-search"><i class="fas fa-search"></i> Buscar</button>
                <a th:href="@{/product}" class="btn-clear"><i class="fas fa-times"></i> Limpiar</a>
            </div>
        </form>
    </section>

    <section class="table-section">
        <h2 class="section-title"><i class="fas fa-boxes"></i> Listado de Productos</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>C&oacute;digo</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${listProducts}">
                    <td th:text="${p.productCode}"></td>
                    <td th:text="${p.productName}"></td>
                    <td th:text="'Q' + ${p.price}"></td>
                    <td th:text="${p.stock}"></td>
                    <td>
                        <span class="badge" th:classappend="${p.productState == 1} ? 'badge-active' : 'badge-inactive'" th:text="${p.productState == 1} ? 'Activo' : 'Inactivo'"></span>
                    </td>
                    <td class="actions">
                        <form th:action="@{/product/delete/{code}(code=${p.productCode})}" method="post">
                            <button type="submit" class="btn-icon btn-delete" onclick="return confirm('¿Seguro que quieres eliminar este producto?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listProducts)}">
                    <td colspan="6" class="empty-row">No hay productos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="form-section">
        <h2 class="section-title">
            <i th:class="${editProduct != null} ? 'fas fa-edit' : 'fas fa-box'"></i>
            <span th:text="${editProduct != null} ? 'Editar Producto' : 'Nuevo Producto'"></span>
        </h2>

        <form th:action="${editProduct != null} ? @{/product/edit/{code}(code=${editProduct.productCode})} : @{/product/add}"
              method="post"
              th:object="${editProduct != null ? editProduct : product}"
              class="product-form">

            <input type="hidden" th:if="${editProduct == null}" th:field="*{productState}" value="1">

            <div class="form-row">
                <div class="form-group" th:if="${editProduct != null}">
                    <label>C&oacute;digo</label>
                    <input type="text" th:field="*{productCode}" readonly class="input-readonly">
                </div>
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" th:field="*{productName}" required>
                </div>
                <div class="form-group">
                    <label>Precio *</label>
                    <input type="text" th:field="*{price}" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>Stock</label>
                    <input type="text" th:field="*{stock}" placeholder="0">
                </div>
                <div class="form-group" th:if="${editProduct != null}">
                    <label>Estado</label>
                    <select th:field="*{productState}">
                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-save">
                    <i th:class="${editProduct != null} ? 'fas fa-save' : 'fas fa-plus'"></i>
                    <span th:text="${editProduct != null} ? 'Actualizar' : 'Agregar'"></span>
                </button>
                <a th:if="${editProduct != null}" th:href="@{/product}" class="btn-cancel"><i class="fas fa-times"></i> Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
