<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>KinalApp - Clientes</title>
    <link rel="icon" href="../static/images/logoKinal.png" th:href="@{/images/logokinal.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/product.css}" href="../static/css/product.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>

<nav>
    <div class="nav-left">
        <img th:src="@{/images/logokinal.png}" src="../static/images/logoKinal.png" alt="Logo Kinal" class="nav-logo">
        <h1 class="nav-title">KinalApp | <a th:href="@{/}">Home</a></h1>
    </div>
    <div class="nav-center">CRUD de Clientes</div>
    <div class="nav-right">
        <form th:action="@{/logout}" method="post" class="btn-logout" >
            <button type="submit" class="btn-logout-btn">
                <i class="fas fa-sign-out-alt">Cerrar Sesión</i>
            </button>
        </form>
    </div>
</nav>

<main>
    <section class="search-section">
        <h2 class="section-title"><i class="fas fa-search"></i> Buscar Cliente</h2>
        <form th:action="@{/client/search}" method="get" class="search-form">
            <div class="search-container">
                <input type="text" name="dpi" placeholder="Ingrese DPI del cliente" class="search-input">
                <button type="submit" class="btn-search"><i class="fas fa-search"></i> Buscar</button>
                <a th:href="@{/client}" class="btn-clear"><i class="fas fa-times"></i> Limpiar</a>
            </div>
        </form>
    </section>

    <section class="form-section">
        <h2 class="section-title"><i class="fas fa-user-plus"></i> Nuevo Cliente</h2>
        <form th:action="@{/client/add}" method="post" th:object="${client}" class="product-form">
            <input type="hidden" th:field="*{state}" value="1">
            <div class="form-row">
                <div class="form-group">
                    <label>DPI</label>
                    <input type="text" th:field="*{DPIClient}" placeholder="DPI del cliente" required>
                </div>
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nameClient}" placeholder="Nombre" required>
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <input type="text" th:field="*{lastNameClient}" placeholder="Apellido" required>
                </div>
                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" th:field="*{address}" placeholder="Dirección">
                </div>
            </div>
            <button type="submit" class="btn-save"><i class="fas fa-plus"></i> Agregar</button>
        </form>
    </section>

    <section class="table-section">
        <h2 class="section-title"><i class="fas fa-users"></i> Listado de Clientes</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>DPI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${listClients}">
                    <td th:text="${c.DPIClient}"></td>
                    <td th:text="${c.nameClient}"></td>
                    <td th:text="${c.lastNameClient}"></td>
                    <td th:text="${c.address}"></td>
                    <td>
                        <span class="badge" th:classappend="${c.state == 1} ? 'badge-active' : 'badge-inactive'"
                              th:text="${c.state == 1} ? 'Activo' : 'Inactivo'"></span>
                    </td>
                    <td class="actions" sec:authorize="hasRole('ADMIN')">
                        <form th:action="@{/client/delete/{dpi}(dpi=${c.DPIClient})}" method="post">
                            <button type="submit" class="btn-icon btn-delete" onclick="return confirm('¿Seguro que quieres eliminar este cliente?')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listClients)}">
                    <td colspan="6" class="empty-row">No hay clientes registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="form-section" sec:authorize="hasRole('ADMIN')">
        <h2 class="section-title"><i class="fas fa-user-edit"></i> Editar Cliente</h2>

        <div th:if="${editClient == null}">
            <form th:action="@{/client/edit/search}" method="get" class="search-form">
                <div sec:authorize="hasRole('ADMIN')" class="search-container">
                    <input type="text" name="dpi" placeholder="DPI del cliente a editar" class="search-input" required>
                    <button type="submit" class="btn-search"><i class="fas fa-search"></i> Buscar</button>
                </div>
            </form>
        </div>

        <div th:if="${editClient != null}">
            <form th:action="@{/client/edit/{dpi}(dpi=${editClient.DPIClient})}" method="post" th:object="${editClient}" class="product-form">
                <div  class="form-row">
                    <div class="form-group">
                        <label>DPI</label>
                        <input type="text" th:field="*{DPIClient}" readonly class="input-readonly">
                    </div>
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nameClient}" required>
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" th:field="*{lastNameClient}" required>
                    </div>
                    <div class="form-group">
                        <label>Dirección</label>
                        <input type="text" th:field="*{address}">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select th:field="*{state}">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <a th:href="@{/client}" class="btn-cancel"><i class="fas fa-times"></i> Cancelar</a>
                    <button type="submit" class="btn-save"><i class="fas fa-save"></i> Actualizar</button>
                </div>
            </form>
        </div>
        <div th:unless="${editProduct != null}" style="text-align: center; color: #666; padding: 20px;">
            <p><i class="fas fa-info-circle"></i> Ingrese el codigo de usuario arriba para habilitar la edición.</p>
        </div>
    </section>
</main>
</body>
</html>
